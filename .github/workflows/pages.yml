name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  # the catalogue lives in a sheet, which cannot tell GitHub it changed — so we
  # look, often enough that a product added before a reel goes out has its
  # preview card ready
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Kept apart from the deploy on purpose. Anything in here may fail — a
  # toolchain that will not install, a sheet that will not answer — and the shop
  # must still publish, so the failure has to be contained in its own job rather
  # than taking the run down with it.
  cards:
    runs-on: ubuntu-latest
    continue-on-error: true
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tools/requirements.txt

      - name: Install image tools
        run: pip install --quiet -r tools/requirements.txt

      - name: Build product preview cards
        run: python tools/build-og.py

      - name: Commit any card changes
        id: commit
        run: |
          if [ -n "$(git status --porcelain p og data/catalog.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add p og data/catalog.json
            git commit -m "Rebuild the product preview cards from the sheet"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "cards already match the sheet"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: cards
    # `always()` so a broken card build cannot stop the shop from publishing
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      # checked out after the card job has pushed, so the run publishes the
      # cards it just built rather than the previous set
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # A timed run that found nothing new stops here. Pages allows only a
      # handful of builds an hour, and spending them republishing an unchanged
      # site would leave none for the moment something genuinely changes.
      - name: Setup Pages
        if: github.event_name != 'schedule' || needs.cards.outputs.changed == 'true'
        uses: actions/configure-pages@v5
      - name: Upload artifact
        if: github.event_name != 'schedule' || needs.cards.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: "."
      - name: Deploy to GitHub Pages
        id: deployment
        if: github.event_name != 'schedule' || needs.cards.outputs.changed == 'true'
        uses: actions/deploy-pages@v4
