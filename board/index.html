<!doctype html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="color-scheme" content="light dark">
<title>Starshopping · Самбар</title>
<script>document.write('<link rel="stylesheet" href="board.css?t='+(Date.now()/60000|0)+'">')</script>
<style>
  .gate{max-width:420px;margin:18vh auto 0;padding:24px;background:var(--s1);border:1px solid var(--ln);border-radius:var(--r);font:14px/1.5 system-ui,sans-serif;color:var(--ink)}
  .gate h1{font-size:18px;margin:0 0 8px}.gate p{color:var(--ink2);margin:0 0 14px}
  .gate input{width:100%;box-sizing:border-box;padding:10px 12px;border:1px solid var(--ln2);border-radius:var(--r-s);background:var(--bg);color:var(--ink);font:inherit}
  .gate button{margin-top:10px;padding:10px 16px;border:0;border-radius:var(--r-s);background:var(--ink);color:var(--bg);font:600 14px system-ui,sans-serif;cursor:pointer}
  .gate .err{color:var(--crit);margin-top:10px}
</style>
</head>
<body>
<div class="gate" id="gate"><h1>Starshopping · Самбар</h1><p>Ачааллаж байна…</p></div>
<!-- Кэшийн хамгаалалт (2026-10-05): GitHub Pages скриптийг 10 минут кэшлэдэг тул push хийсний дараа хуучин код харагддаг байсан.
     Одоо файл бүрд 1 минутын хувилбар (?t=) залгана → push хийснээс 1 минутын дотор шинэ код ачаална. -->
<script>(function(){var t=Math.floor(Date.now()/60000);window.__bt=t;
['icons','render','tests','ops','orders','money','app'].forEach(function(f){document.write('<script src="'+f+'.js?t='+t+'"><\/script>')});})();</script>
